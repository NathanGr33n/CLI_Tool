    gap: 8px;

    justify-content: center;
    transition: all 0.15s ease;

.status-control-btn:hover {

    color: var(--text-primary, #e5e5e5);

.current-time {

    border-radius: 8px;

}

.time-display {
    font-size: 9px;
    font-weight: 600;
    color: var(--text-primary, #e5e5e5);
}

/* Dividers */
.status-divider {
    width: 1px;
    height: 12px;
    background: var(--border-color, #3e3e42);
    opacity: 0.5;
}

/* Animations */
.metric-value.updating {
    animation: metric-update 0.3s ease-in-out;
}

@keyframes metric-update {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; transform: scale(0.95); }
}

/* Responsive Design */
@media (max-width: 1200px) {
    .system-metrics {
        display: none;

}

@media (max-width: 900px) {
    .git-info {
        display: none !important;

    }

@media (max-width: 600px) {

@media (max-width: 400px) {
    .bottom-status-bar {
        padding: 0 8px;

    .status-section-center,

        gap: 4px;
    }
    
    .status-divider {
        display: none;
    }
}

/* Hover Effects */
.shell-indicator:hover,
.connection-status:hover,
.git-info:hover {
    background: var(--bg-hover, #3e3e42);
    transition: background 0.2s ease;
}

    opacity: 0.8;
    cursor: pointer;
}

.current-time:hover {
    background: var(--bg-hover, #3e3e42);
    cursor: pointer;
    transition: background 0.2s ease;
}
