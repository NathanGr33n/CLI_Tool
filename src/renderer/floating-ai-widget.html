<style>
.floating-ai-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 10000;
    font-family: 'Segoe UI', system-ui, sans-serif;
}

/* Floating Action Button (Collapsed State) */
.ai-toggle-fab {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #007acc 0%, #0099ff 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 122, 204, 0.3), 0 2px 8px rgba(0, 0, 0, 0.2);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    color: white;
    position: relative;
    user-select: none;
}

.ai-toggle-fab:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(0, 122, 204, 0.4), 0 3px 12px rgba(0, 0, 0, 0.3);
}

.ai-toggle-fab:active {
    transform: scale(0.95);
}

.notification-dot {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 12px;
    height: 12px;
    background: #ff4757;
    border-radius: 50%;
    border: 2px solid white;
    animation: pulse-notification 2s infinite;
}

@keyframes pulse-notification {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.2); opacity: 0.8; }
    100% { transform: scale(1); opacity: 1; }
}

/* Chat Popup (Expanded State) */
.ai-chat-popup {
    position: absolute;
    bottom: 70px;
    right: 0;
    width: 380px;
    height: 500px;
    background: var(--bg-secondary, #252526);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border-color, #3e3e42);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transform: scale(0.8) translateY(20px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    overflow: hidden;
    min-width: 320px;
    min-height: 400px;
}

.ai-chat-popup.show {
    transform: scale(1) translateY(0);
    opacity: 1;
}

.ai-popup-header {
    height: 48px;
    background: linear-gradient(135deg, var(--bg-tertiary, #2d2d30) 0%, var(--bg-secondary, #252526) 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--border-color, #3e3e42);
    cursor: move;
    user-select: none;
}

.ai-popup-title {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-primary, #e5e5e5);
    font-weight: 600;
    font-size: 14px;
}

.ai-popup-title svg {
    color: #007acc;
}

.ai-popup-controls {
    display: flex;
    gap: 4px;
}

.popup-control-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: var(--text-muted, #969696);
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}

.popup-control-btn:hover {
    background: var(--bg-hover, #3e3e42);
    color: var(--text-primary, #e5e5e5);
}

.close-popup:hover {
    background: #e74c3c;
    color: white;
}

.ai-popup-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    max-height: 360px;
    scrollbar-width: thin;
    scrollbar-color: var(--border-color, #3e3e42) transparent;
}

.ai-popup-messages::-webkit-scrollbar {
    width: 6px;
}

.ai-popup-messages::-webkit-scrollbar-track {
    background: transparent;
}

.ai-popup-messages::-webkit-scrollbar-thumb {
    background: var(--border-color, #3e3e42);
    border-radius: 3px;
}

.ai-welcome-message,
.ai-message-item {
    margin-bottom: 16px;
}

.message-content-ai {
    display: flex;
    gap: 12px;
    align-items: flex-start;
}

.message-content-user {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    flex-direction: row-reverse;
}

.ai-avatar {

    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #007acc, #0099ff);

    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
}

.user-avatar {

    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #27ae60, #2ecc71);

    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    color: white;
}

.message-text {
    flex: 1;
    background: var(--bg-tertiary, #2d2d30);
    padding: 12px 16px;
    border-radius: 16px;
    color: var(--text-primary, #e5e5e5);
    font-size: 13px;
    line-height: 1.4;
    position: relative;
}

.message-content-user .message-text {
    background: #007acc;
    color: white;
}

.message-time {
    font-size: 10px;

    margin-top: 6px;
    opacity: 0.8;
}

.ai-popup-input {
    background: var(--bg-tertiary, #2d2d30);
    padding: 12px;
    border-top: 1px solid var(--border-color, #3e3e42);
}

.input-container {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
}

.ai-input-field {
    flex: 1;
    padding: 10px 12px;
    background: var(--bg-secondary, #252526);
    border: 1px solid var(--border-color, #3e3e42);
    border-radius: 20px;
    color: var(--text-primary, #e5e5e5);
    font-size: 13px;
    outline: none;
    transition: all 0.2s ease;
}

.ai-input-field:focus {
    border-color: #007acc;
    box-shadow: 0 0 0 2px rgba(0, 122, 204, 0.2);
}

.ai-input-field::placeholder {
    color: var(--text-muted, #969696);
}

.send-btn {
    width: 36px;
    height: 36px;
    background: #007acc;
    border: none;
    border-radius: 50%;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}

.send-btn:hover {
    background: #005a9e;
    transform: scale(1.05);
}

.send-btn:disabled {
    background: var(--bg-hover, #3e3e42);
    color: var(--text-muted, #969696);
    cursor: not-allowed;
    transform: none;
}

.quick-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.quick-action-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    background: var(--bg-secondary, #252526);
    border: 1px solid var(--border-color, #3e3e42);
    border-radius: 12px;
    color: var(--text-secondary, #cccccc);
    font-size: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.quick-action-btn:hover {
    background: #007acc;
    color: white;
    border-color: #007acc;
}

.resize-handle {
    position: absolute;
    top: 0;
    left: 0;
    width: 10px;
    height: 10px;
    cursor: nw-resize;
    opacity: 0;
    transition: opacity 0.2s ease;
}

.ai-chat-popup:hover .resize-handle {
    opacity: 1;
}

/* Animation states */
.floating-ai-widget.minimizing .ai-toggle-fab {
    animation: minimize-bounce 0.4s ease-out;
}

@keyframes minimize-bounce {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

/* Responsive adjustments */
@media (max-height: 600px) {
    .ai-chat-popup {
        height: 400px;
        bottom: 60px;
    }
    
    .ai-popup-messages {
        max-height: 260px;
    }
}

@media (max-width: 480px) {
    .ai-chat-popup {
        width: calc(100vw - 40px);
        right: -40px;
    }
    
    .floating-ai-widget {
        right: 10px;
        bottom: 10px;
    }
}

/* Typing indicator */
.typing-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--text-muted, #969696);
    font-size: 12px;
    font-style: italic;
    padding: 8px 16px;
}

.typing-dots {
    display: flex;
    gap: 2px;
}

.typing-dot {
    width: 4px;
    height: 4px;
    background: var(--text-muted, #969696);
    border-radius: 50%;
    animation: typing-bounce 1.4s infinite ease-in-out;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing-bounce {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
}
</style>
