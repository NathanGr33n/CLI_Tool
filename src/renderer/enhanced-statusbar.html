<style>
.enhanced-status-bar {
    height: 28px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    font-size: 11px;
    color: var(--text-secondary);
    user-select: none;
}

.status-left-enhanced, .status-right-enhanced {
    display: flex;
    align-items: center;
    gap: 12px;
}

.status-center-enhanced {
    flex: 1;
    display: flex;
    justify-content: center;
}

.current-session {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-tertiary);
    padding: 4px 8px;
    border-radius: 12px;
    font-weight: 500;
}

.session-icon {
    display: flex;
    align-items: center;
}

.shell-icon.powershell { color: #1f6ac7; }
.shell-icon.cmd { color: #f39c12; }
.shell-icon.wsl { color: #e95420; }
.shell-icon.bash { color: #4eaa25; }

.current-location {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Cascadia Code', monospace;
    font-size: 10px;
}

.folder-icon {
    opacity: 0.7;
}

.git-status {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-tertiary);
    padding: 3px 8px;
    border-radius: 10px;
    font-family: monospace;
    font-size: 10px;
}

.git-icon {
    opacity: 0.8;
}

.git-branch-enhanced {
    color: var(--accent-green);
    font-weight: 600;
}

.git-changes {
    color: var(--accent-orange);
    font-size: 9px;
    opacity: 0.9;
}

.command-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}

.last-command {
    font-size: 10px;
    color: var(--text-muted);
    font-family: monospace;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.execution-time {
    font-size: 9px;
    color: var(--accent-blue);
    font-weight: 500;
}

.system-stats {
    display: flex;
    gap: 12px;
}

.stat-item {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-tertiary);
    padding: 3px 6px;
    border-radius: 8px;
    font-size: 9px;
}

.stat-label {
    font-weight: 500;
    opacity: 0.8;
}

.stat-value {
    font-weight: 600;
    font-family: monospace;
}

.cpu-stat .stat-value {
    color: var(--accent-blue);
}

.memory-stat .stat-value {
    color: var(--accent-green);
}

.connection-status {
    display: flex;
    align-items: center;
}

.connection-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    padding: 3px 6px;
    border-radius: 6px;
    background: var(--bg-tertiary);
}

.connection-indicator.connected {
    color: var(--accent-green);
}

.connection-indicator.disconnected {
    color: var(--accent-red);
}

.connection-indicator.connecting {
    color: var(--accent-orange);
}

.quick-actions {
    display: flex;
    gap: 4px;
}

.status-btn {
    width: 24px;
    height: 20px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
}

.status-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
}

.agent-toggle-btn-enhanced.active {
    color: var(--accent-blue);
    background: rgba(0, 122, 204, 0.1);
}

.clock {
    display: flex;
    align-items: center;
    font-family: 'Cascadia Code', monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-primary);
    background: var(--bg-tertiary);
    padding: 3px 8px;
    border-radius: 8px;
}

.status-separator {
    width: 1px;
    height: 16px;
    background: var(--border-color);
    opacity: 0.5;
}

/* Responsive adjustments */
@media (max-width: 1000px) {
    .system-stats {
        display: none;
    }
}

@media (max-width: 768px) {
    .git-status,
    .command-info {
        display: none;
    }
    
    .status-separator {
        display: none;
    }
}

@media (max-width: 480px) {
    .current-location {
        display: none;
    }
}

/* Animation for updating stats */
.stat-value.updating {
    animation: pulse 0.3s ease-in-out;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
}

/* Connection status animations */
.connection-indicator.connecting .connection-icon {
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
